<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Search any city and see current weather and a 5-day temperature forecast chart." />
  <title>Weather Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Weather Dashboard</h1>
      <p class="muted">Search a city to see live weather and a 5-day forecast.</p>
    </header>

    <form id="search-form" class="search-form">
      <input id="city-input" placeholder="Search city (e.g. Seoul)" aria-label="City name" required />
      <button type="submit" class="btn-primary">Search</button>
    </form>

    <div class="quick" id="quick"></div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="current" class="current hidden">
      <div>
        <h2 id="place"></h2>
        <p id="condition" class="muted"></p>
      </div>
      <p id="temp" class="temp"></p>
      <div class="stats">
        <div class="stat"><span class="label">Humidity</span><span id="humidity"></span></div>
        <div class="stat"><span class="label">Wind</span><span id="wind"></span></div>
      </div>
    </section>

    <section id="forecast" class="forecast hidden">
      <h3>5-Day Forecast</h3>
      <div class="chart-box"><canvas id="chart" aria-label="5-day temperature chart" role="img"></canvas></div>
      <div id="days" class="days"></div>
    </section>

    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
